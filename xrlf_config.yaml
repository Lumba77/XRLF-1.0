model: gemma-4-12b-xrl.xrlf

gpu_layers: -1          # -1 = offload all to VRAM
n_ctx: 8192             # context window (adjust for VRAM)

api:
  host: 127.0.0.1
  port: 8300

session:
  id: default
  persistent_memory: true   # re-pack memory into .xrlf on session end

xrl:
  steering_strength: 0.8
  profile_auto_detect: true
  verbose: false

memory:
  token_budget: 2048      # tokens reserved for foveated ring block
  tfidf_top_k: 5

tts:
  enabled: true
  engine: auto            # provider selection: http → kokoro → piper → espeak → stub
  provider: http          # portable default: use the XRLF TTS service if available
  endpoint: http://127.0.0.1:8004/tts
  voice: default
  fallback:
    - http
    - piper
    - espeak
    - stub

# Gemma-4-12B GGUF source for packing
# MoQ-3.5 = 4.7 GB (higher quality), MoQ-3.0 = 3.78 GB (faster)
gguf_source: ""          # Set to your local GGUF path, e.g. C:/path/to/your/model.gguf

# Embed existing foveated memory DB (accumulated conversations)
memory_db_source: "foveated-memory/memory_data/default/memory.db"   # auto-created on first run

